<!doctype html>
<html lang="uk" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Watchlist{% endblock %} · Watchlist</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.11/dist/htmx.min.js"
          integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
          crossorigin="anonymous" defer></script>
</head>
<body class="flex min-h-full flex-col bg-slate-50 text-slate-900 antialiased"
      hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
  <header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-5xl items-center justify-between gap-4 px-4 py-3">
      <div class="flex items-center gap-6">
        <a href="/" class="text-lg font-semibold tracking-tight">Watchlist</a>
        {% if current_user %}
          <a href="/list" class="text-sm text-slate-600 hover:text-slate-900">Мій список</a>
          <a href="/search" class="text-sm text-slate-600 hover:text-slate-900">Пошук</a>
        {% endif %}
      </div>
      {% if current_user %}
        <div class="flex items-center gap-4 text-sm">
          <span class="text-slate-600">{{ current_user.username }}</span>
          <form method="post" action="/logout">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="text-slate-600 hover:text-slate-900">Вийти</button>
          </form>
        </div>
      {% else %}
        <div class="flex items-center gap-4 text-sm">
          <a href="/login" class="text-slate-600 hover:text-slate-900">Вхід</a>
          <a href="/register" class="rounded-md bg-slate-900 px-3 py-1.5 font-medium text-white hover:bg-slate-700">Реєстрація</a>
        </div>
      {% endif %}
    </nav>
  </header>
  <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-8">
    {% block content %}{% endblock %}
  </main>
  <footer class="border-t border-slate-200 bg-white">
    <div class="mx-auto max-w-5xl px-4 py-4 text-xs text-slate-500">
      Дані про фільми й серіали надає <a href="https://www.themoviedb.org/" class="underline hover:text-slate-700" rel="noopener" target="_blank">TMDB</a>.
      This product uses the TMDB API but is not endorsed or certified by TMDB.
    </div>
  </footer>
</body>
</html>
