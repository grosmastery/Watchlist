{% set target = "#entry-" ~ title_id %}
{% set select_class = "rounded-md border border-slate-300 bg-white py-1.5 pl-2 pr-8 text-sm shadow-sm outline-none focus:border-slate-500 focus:ring-2 focus:ring-slate-200" %}
<div id="entry-{{ title_id }}" class="flex flex-wrap items-center gap-2">
  {% if entry %}
    <select name="status" aria-label="Статус"
            hx-patch="/list/{{ title_id }}?view={{ view }}" hx-trigger="change"
            hx-target="{{ target }}" hx-swap="outerHTML" class="{{ select_class }}">
      {% for item in list_statuses %}
        <option value="{{ item.value }}" {% if entry.status == item %}selected{% endif %}>{{ item.label }}</option>
      {% endfor %}
    </select>
    <select name="rating" aria-label="Оцінка"
            hx-patch="/list/{{ title_id }}?view={{ view }}" hx-trigger="change"
            hx-target="{{ target }}" hx-swap="outerHTML" class="{{ select_class }}">
      <option value="" {% if entry.rating is none %}selected{% endif %}>Без оцінки</option>
      {% for value in rating_values %}
        <option value="{{ value }}" {% if entry.rating == value %}selected{% endif %}>★ {{ value }}</option>
      {% endfor %}
    </select>
    <button type="button"
            hx-delete="/list/{{ title_id }}?view={{ view }}" hx-confirm="Прибрати зі списку?"
            hx-target="{{ '#row-' ~ title_id if view == 'list' else target }}" hx-swap="outerHTML"
            class="rounded-md px-2 py-1.5 text-sm text-slate-500 hover:bg-slate-100 hover:text-red-600">
      Прибрати
    </button>
  {% else %}
    <form method="post" action="/list/{{ title_id }}" class="flex flex-wrap items-center gap-2"
          hx-post="/list/{{ title_id }}?view={{ view }}" hx-target="{{ target }}" hx-swap="outerHTML">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <select name="status" aria-label="Статус" class="{{ select_class }}">
        {% for item in list_statuses %}
          <option value="{{ item.value }}" {% if item.value == "planned" %}selected{% endif %}>{{ item.label }}</option>
        {% endfor %}
      </select>
      <button type="submit" class="rounded-md bg-slate-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-slate-700">
        Додати до списку
      </button>
    </form>
  {% endif %}
</div>
