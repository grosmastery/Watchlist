{% if season.upcoming %}
  <span class="mt-1.5 inline-flex items-center gap-1.5 rounded-full border border-white/15 px-2.5 py-0.5 text-xs font-semibold text-muted">
    <svg viewBox="0 0 20 20" fill="currentColor" class="h-3.5 w-3.5" aria-hidden="true"><path fill-rule="evenodd" d="M5.75 2a.75.75 0 0 1 .75.75V4h7V2.75a.75.75 0 0 1 1.5 0V4h.25A2.75 2.75 0 0 1 18 6.75v8.5A2.75 2.75 0 0 1 15.25 18H4.75A2.75 2.75 0 0 1 2 15.25v-8.5A2.75 2.75 0 0 1 4.75 4H5V2.75A.75.75 0 0 1 5.75 2Zm-1 5.5c-.69 0-1.25.56-1.25 1.25v6.5c0 .69.56 1.25 1.25 1.25h10.5c.69 0 1.25-.56 1.25-1.25v-6.5c0-.69-.56-1.25-1.25-1.25H4.75Z" clip-rule="evenodd"/></svg>
    {% if season.is_premiere %}Прем'єра{% else %}Сезон {{ season.number }}{% endif %} з {{ season.air_date.strftime("%d.%m") }}
  </span>
{% else %}
  <span class="mt-1.5 inline-flex items-center gap-1.5 rounded-full bg-accent px-2.5 py-0.5 text-xs font-bold text-on-accent" title="Сезон {{ season.number }} вийшов {{ season.air_date | format_date }}">
    <span class="h-1.5 w-1.5 rounded-full bg-on-accent motion-safe:animate-pulse" aria-hidden="true"></span>
    {% if season.is_premiere %}Прем'єра{% else %}Новий сезон{% endif %}
  </span>
{% endif %}
