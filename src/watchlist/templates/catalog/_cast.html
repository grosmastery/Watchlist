<section class="mt-14">
  <h2 class="heading-section mb-2">Актори</h2>
  <ul class="no-scrollbar -mx-4 flex snap-x scroll-px-4 gap-4 overflow-x-auto px-4 pt-2 pb-3 sm:-mx-6 sm:scroll-px-6 sm:px-6 lg:-mx-8 lg:scroll-px-8 lg:px-8">
    {% for actor in actors %}
      <li class="w-28 shrink-0 snap-start text-center sm:w-32">
        <a href="{{ actor.url }}" target="_blank" rel="noopener noreferrer" class="group block rounded-lg">
          <div class="mx-auto aspect-square w-24 overflow-hidden rounded-full bg-raised ring-1 ring-white/10 transition group-hover:ring-2 group-hover:ring-accent-soft sm:w-28">
            {% if actor.photo_path %}
              <img src="{{ actor.photo_path | poster_url('w185') }}" alt="" loading="lazy" class="h-full w-full object-cover object-top">
            {% else %}
              <div class="flex h-full items-center justify-center font-display text-2xl text-faint" aria-hidden="true">{{ actor.name[:1] }}</div>
            {% endif %}
          </div>
          <p class="mt-3 line-clamp-2 text-sm leading-snug font-bold transition group-hover:text-accent-soft">{{ actor.name }}</p>
          {% if actor.role %}<p class="mt-0.5 line-clamp-2 text-xs text-faint">{{ actor.role }}</p>{% endif %}
        </a>
      </li>
    {% endfor %}
  </ul>
</section>
