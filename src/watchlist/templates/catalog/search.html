{% extends "base.html" %}

{% block title %}{{ query ~ " — пошук" if query else "Пошук" }}{% endblock %}

{% block content %}
  <h1 class="mb-4 text-2xl font-semibold tracking-tight">Пошук</h1>
  <form method="get" action="/search" role="search" class="mb-6">
    <label for="q" class="sr-only">Назва серіалу або фільму</label>
    <div class="relative">
      <input id="q" name="q" type="search" value="{{ query }}" autofocus autocomplete="off"
             maxlength="200" placeholder="Назва серіалу або фільму"
             hx-get="/search" hx-trigger="input changed delay:400ms, search"
             hx-target="#search-results" hx-push-url="true" hx-indicator="#search-indicator"
             class="block w-full rounded-md border border-slate-300 px-4 py-2.5 shadow-sm outline-none focus:border-slate-500 focus:ring-2 focus:ring-slate-200">
      <span id="search-indicator" class="htmx-indicator absolute inset-y-0 right-3 flex items-center text-sm text-slate-400">Шукаю…</span>
    </div>
  </form>
  <div id="search-results">
    {% include "catalog/_search_results.html" %}
  </div>
{% endblock %}
