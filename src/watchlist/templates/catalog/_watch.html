<section class="mt-6" aria-labelledby="watch-heading">
  <h2 id="watch-heading" class="text-xs font-bold tracking-widest text-faint uppercase">Де дивитись</h2>
  <div class="mt-3 flex flex-wrap gap-x-8 gap-y-4">
    {% for group in watch.groups %}
      <div>
        <p class="mb-2 text-xs font-semibold text-muted">{{ group.label }}</p>
        <ul class="flex flex-wrap gap-2">
          {% for provider in group.providers %}
            <li>
              <a href="{{ watch.link }}" target="_blank" rel="noopener noreferrer" title="{{ provider.provider_name }}" class="group block rounded-xl">
                {% if provider.logo_path %}
                  <img src="{{ provider.logo_path | poster_url('w92') }}" alt="{{ provider.provider_name }}" loading="lazy" class="h-11 w-11 rounded-xl ring-1 ring-white/10 transition group-hover:ring-2 group-hover:ring-accent-soft">
                {% else %}
                  <span class="chip block">{{ provider.provider_name }}</span>
                {% endif %}
              </a>
            </li>
          {% endfor %}
        </ul>
      </div>
    {% endfor %}
  </div>
  <p class="mt-3 text-xs text-faint">Дані про сервіси: JustWatch</p>
</section>
