{% macro field(name, label, type="text", value="", error=None, autocomplete=None) %}
  <div>
    <label for="{{ name }}" class="mb-1.5 block text-sm font-semibold text-muted">{{ label }}</label>
    <input id="{{ name }}" name="{{ name }}" type="{{ type }}" value="{{ value }}"
           {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %}
           {% if error %}aria-invalid="true" aria-describedby="{{ name }}-error"{% endif %}
           class="field py-2.5 {{ 'field-invalid' if error }}">
    {% if error %}
      <p id="{{ name }}-error" class="mt-1.5 text-sm text-red-300">{{ error }}</p>
    {% endif %}
  </div>
{% endmacro %}

{% macro form_error(errors) %}
  {% if errors.get("__all__") %}
    <div role="alert" class="alert alert-danger">
      {{ errors["__all__"] }}
    </div>
  {% endif %}
{% endmacro %}

{% macro submit(label) %}
  <button type="submit" class="btn btn-primary w-full py-2.5">
    {{ label }}
  </button>
{% endmacro %}
