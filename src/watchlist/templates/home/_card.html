<li class="w-36 shrink-0 snap-start sm:w-44">
  <a href="{{ card.url }}" class="group block rounded-lg">
    <div class="poster shadow-lg ring-1 shadow-black/50 ring-white/10 transition duration-300 group-hover:ring-2 group-hover:ring-accent-soft motion-safe:group-hover:-translate-y-1">
      <img src="{{ card.poster_path | poster_url('w342') }}" alt="" loading="lazy" class="h-full w-full object-cover transition duration-500 motion-safe:group-hover:scale-105">
      {% if card.badge %}
        <span class="absolute top-2 left-2 rounded-md px-2 py-1 text-xs font-extrabold shadow-md shadow-black/40 {{ 'bg-accent text-on-accent' if card.is_new_season else 'bg-fg text-canvas' }}">{{ card.badge }}</span>
      {% endif %}
    </div>
    <p class="mt-3 line-clamp-2 text-sm leading-snug font-bold transition group-hover:text-accent-soft">{{ card.name }}</p>
    <p class="mt-0.5 text-xs {{ 'font-bold text-accent-soft' if card.is_new_season else 'text-faint' }}">{{ card.subtitle }}</p>
    {% if card.note %}<p class="mt-1 line-clamp-2 text-xs leading-snug text-muted">{{ card.note }}</p>{% endif %}
  </a>
</li>
