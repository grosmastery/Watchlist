name: watchlist

services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key}
      DATABASE_URL: postgresql+asyncpg://watchlist:watchlist@db:5432/watchlist
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "watchlist.tasks.worker"]
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      RUN_MIGRATIONS: "0"
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key}
      DATABASE_URL: postgresql+asyncpg://watchlist:watchlist@db:5432/watchlist
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: watchlist
      POSTGRES_PASSWORD: watchlist
      POSTGRES_DB: watchlist
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchlist -d watchlist"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
